<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="100%" height="100%">
  <defs>
    <linearGradient id="n5Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <rect width="400" height="220" fill="url(#n5Bg)"/>
  <!-- Estante de libros con colores llamativos -->
  <g transform="translate(60, 40)">
    <!-- Estante de madera -->
    <rect x="-10" y="115" width="300" height="12" fill="#78350f" rx="3"/>
    <!-- Libro grande abierto al centro -->
    <g transform="translate(140, 60)">
      <path d="M-60 40 C-30 25 0 28 0 40 C0 28 30 25 60 40 L60 -10 C30 -25 0 -22 0 -10 C0 -22 -30 -25 -60 -10 Z"
            fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
      <path d="M0 -10 L0 40" stroke="#94a3b8" stroke-width="2"/>
      <!-- Letras / magia saliendo del libro -->
      <text x="-40" y="5" font-family="serif" font-size="22" fill="#f59e0b" font-weight="bold">A</text>
      <text x="30" y="-5" font-family="serif" font-size="18" fill="#38bdf8" font-weight="bold">Z</text>
      <text x="-15" y="-18" font-family="serif" font-size="26" fill="#ec4899" font-weight="bold">✦</text>
      <text x="15" y="-22" font-family="serif" font-size="20" fill="#facc15" font-weight="bold">★</text>
    </g>
    <!-- Fila de libros en el estante -->
    <rect x="0" y="25" width="18" height="90" fill="#ef4444" rx="2"/>
    <rect x="22" y="15" width="22" height="100" fill="#f59e0b" rx="2"/>
    <rect x="48" y="35" width="16" height="80" fill="#10b981" rx="2"/>
    <!-- Libro inclinado -->
    <g transform="translate(70, 30) rotate(15)">
      <rect x="0" y="0" width="18" height="85" fill="#8b5cf6" rx="2"/>
    </g>
    <!-- Libros lado derecho -->
    <rect x="210" y="20" width="20" height="95" fill="#0284c7" rx="2"/>
    <rect x="234" y="30" width="16" height="85" fill="#f43f5e" rx="2"/>
    <rect x="254" y="10" width="24" height="105" fill="#14b8a6" rx="2"/>
  </g>
</svg>