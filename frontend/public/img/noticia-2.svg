<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="100%" height="100%">
  <defs>
    <linearGradient id="n2Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="400" height="220" fill="url(#n2Bg)"/>
  <!-- Pistas de circuito electrónico en el fondo -->
  <g stroke="#38bdf8" stroke-width="2" opacity="0.4" fill="none">
    <path d="M20 50 H80 L120 90 H200"/>
    <circle cx="200" cy="90" r="4" fill="#38bdf8"/>
    <path d="M380 180 H300 L260 140 H180"/>
    <circle cx="180" cy="140" r="4" fill="#38bdf8"/>
    <path d="M30 180 H90 L130 140 V100"/>
    <circle cx="130" cy="100" r="4" fill="#4ade80"/>
  </g>
  <!-- Robot Educativo Escolar -->
  <g transform="translate(140, 40)">
    <!-- Orugas / Ruedas -->
    <rect x="0" y="100" width="120" height="25" rx="10" fill="#475569" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="20" cy="112" r="8" fill="#1e293b"/>
    <circle cx="60" cy="112" r="8" fill="#1e293b"/>
    <circle cx="100" cy="112" r="8" fill="#1e293b"/>
    <!-- Chasis del Robot -->
    <rect x="15" y="45" width="90" height="58" rx="8" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
    <!-- Pantalla/Matriz LED frontal -->
    <rect x="30" y="60" width="60" height="28" rx="4" fill="#0f172a"/>
    <circle cx="45" cy="74" r="5" fill="#4ade80"/>
    <circle cx="75" cy="74" r="5" fill="#4ade80"/>
    <!-- Cabeza / Sensor Ultrasonido (Ojos) -->
    <rect x="35" y="15" width="50" height="30" rx="6" fill="#38bdf8"/>
    <circle cx="48" cy="30" r="8" fill="#0f172a" stroke="#fff" stroke-width="2"/>
    <circle cx="72" cy="30" r="8" fill="#0f172a" stroke="#fff" stroke-width="2"/>
    <!-- Antena con luz -->
    <line x1="60" y1="15" x2="60" y2="2" stroke="#94a3b8" stroke-width="3"/>
    <circle cx="60" cy="0" r="5" fill="#ef4444"/>
    <!-- Brazo mecánico sujetando residuo reciclable -->
    <path d="M105 60 L135 45 L145 65" stroke="#f59e0b" stroke-width="6" stroke-linecap="round" fill="none"/>
    <rect x="140" y="60" width="16" height="24" rx="3" fill="#22c55e"/> <!-- Botella -->
  </g>
  <!-- Trofeo o medalla de clasificación -->
  <g transform="translate(320, 25)">
    <circle cx="20" cy="20" r="20" fill="#f59e0b"/>
    <polygon points="20,10 23,17 30,17 25,22 27,29 20,25 13,29 15,22 10,17 17,17" fill="#fff"/>
  </g>
</svg>