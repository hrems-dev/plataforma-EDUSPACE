<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="100%" height="100%">
  <defs>
    <linearGradient id="n3Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
  </defs>
  <rect width="400" height="220" fill="url(#n3Bg)"/>
  <!-- Líneas de la Cancha de Vóley -->
  <path d="M0 160 L400 160 L400 220 L0 220 Z" fill="#059669"/>
  <line x1="0" y1="160" x2="400" y2="160" stroke="#fff" stroke-width="4"/>
  <line x1="200" y1="160" x2="200" y2="220" stroke="#fff" stroke-width="3"/>
  <line x1="90" y1="160" x2="90" y2="220" stroke="#fff" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="310" y1="160" x2="310" y2="220" stroke="#fff" stroke-width="2" stroke-dasharray="6 4"/>

  <!-- Poste y Red de Vóley -->
  <rect x="196" y="40" width="8" height="120" fill="#cbd5e1"/>
  <rect x="0" y="40" width="400" height="60" fill="none" stroke="#fff" stroke-width="1.5" opacity="0.6"/>
  <!-- Malla cuadrícula -->
  <g stroke="#fff" stroke-width="1" opacity="0.4">
    <line x1="0" y1="52" x2="400" y2="52"/>
    <line x1="0" y1="64" x2="400" y2="64"/>
    <line x1="0" y1="76" x2="400" y2="76"/>
    <line x1="0" y1="88" x2="400" y2="88"/>
    <!-- Verticales malla -->
    <line x1="50" y1="40" x2="50" y2="100"/>
    <line x1="100" y1="40" x2="100" y2="100"/>
    <line x1="150" y1="40" x2="150" y2="100"/>
    <line x1="250" y1="40" x2="250" y2="100"/>
    <line x1="300" y1="40" x2="300" y2="100"/>
    <line x1="350" y1="40" x2="350" y2="100"/>
  </g>
  <!-- Borde superior de la red blanco -->
  <rect x="0" y="38" width="400" height="7" fill="#fff"/>

  <!-- Balón de Vóley Escolar en pleno remate -->
  <g transform="translate(240, 20)">
    <circle cx="35" cy="35" r="32" fill="#f8fafc" stroke="#334155" stroke-width="2.5"/>
    <!-- Paneles amarillos y azules característicos -->
    <path d="M12 20 Q35 35 35 67" stroke="#2563eb" stroke-width="8" fill="none"/>
    <path d="M58 20 Q35 35 35 67" stroke="#f59e0b" stroke-width="8" fill="none"/>
    <path d="M15 48 Q35 35 55 48" stroke="#2563eb" stroke-width="6" fill="none"/>
    <path d="M22 10 Q35 35 48 10" stroke="#f59e0b" stroke-width="6" fill="none"/>
    <!-- Líneas de velocidad de remate -->
    <line x1="75" y1="35" x2="100" y2="35" stroke="#fef08a" stroke-width="3" stroke-linecap="round"/>
    <line x1="70" y1="20" x2="92" y2="12" stroke="#fef08a" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="70" y1="50" x2="92" y2="58" stroke="#fef08a" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>