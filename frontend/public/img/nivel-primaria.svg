<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="primBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
  </defs>
  <!-- Fondo azul suave primario -->
  <rect width="400" height="240" rx="14" fill="url(#primBg)"/>

  <!-- Pizarra cuadrícula matemática suave de fondo -->
  <g stroke="#93c5fd" stroke-width="0.8" opacity="0.35">
    <line x1="20" y1="40" x2="380" y2="40"/>
    <line x1="20" y1="80" x2="380" y2="80"/>
    <line x1="20" y1="120" x2="380" y2="120"/>
    <line x1="20" y1="160" x2="380" y2="160"/>
    <line x1="60" y1="20" x2="60" y2="220"/>
    <line x1="120" y1="20" x2="120" y2="220"/>
    <line x1="180" y1="20" x2="180" y2="220"/>
    <line x1="240" y1="20" x2="240" y2="220"/>
    <line x1="300" y1="20" x2="300" y2="220"/>
    <line x1="360" y1="20" x2="360" y2="220"/>
  </g>

  <!-- Globo Terráqueo Escolar -->
  <g transform="translate(45, 45)">
    <!-- Base y semicírculo metálico -->
    <path d="M45 130 L75 130" stroke="#475569" stroke-width="6" stroke-linecap="round"/>
    <path d="M60 130 L60 115" stroke="#475569" stroke-width="5"/>
    <path d="M60 115 C20 115 15 25 60 15" fill="none" stroke="#64748b" stroke-width="4.5"/>
    <!-- Esfera Tierra -->
    <circle cx="60" cy="65" r="42" fill="#0284c7"/>
    <!-- Continentes verdes -->
    <path d="M40 50 Q50 35 65 40 Q75 45 70 60 Q55 65 45 75 Z" fill="#22c55e"/>
    <path d="M68 65 Q85 60 92 75 Q80 95 65 85 Z" fill="#22c55e"/>
    <path d="M35 70 Q45 80 40 95 Q25 90 30 75 Z" fill="#22c55e"/>
    <!-- Eje inclinado -->
    <line x1="60" y1="15" x2="60" y2="115" stroke="#475569" stroke-width="2.5" transform="rotate(23 60 65)"/>
  </g>

  <!-- Pila de Libros Escolares de Primaria -->
  <g transform="translate(180, 100)">
    <!-- Libro 1 (Base - Verde Ciencias) -->
    <rect x="0" y="70" width="160" height="26" rx="4" fill="#059669"/>
    <rect x="15" y="74" width="140" height="18" fill="#f8fafc"/>
    <line x1="0" y1="70" x2="0" y2="96" stroke="#047857" stroke-width="6"/>
    <text x="35" y="87" fill="#065f46" font-family="sans-serif" font-size="11" font-weight="bold">CIENCIAS 4°</text>

    <!-- Libro 2 (Medio - Azul Matemáticas) -->
    <rect x="10" y="44" width="145" height="26" rx="4" fill="#2563eb"/>
    <rect x="25" y="48" width="125" height="18" fill="#f8fafc"/>
    <line x1="10" y1="44" x2="10" y2="70" stroke="#1d4ed8" stroke-width="6"/>
    <text x="45" y="61" fill="#1e40af" font-family="sans-serif" font-size="11" font-weight="bold">MATEMÁTICA</text>

    <!-- Libro 3 (Superior - Rojo Comunicación) -->
    <rect x="20" y="18" width="130" height="26" rx="4" fill="#dc2626"/>
    <rect x="35" y="22" width="110" height="18" fill="#f8fafc"/>
    <line x1="20" y1="18" x2="20" y2="44" stroke="#b91c1c" stroke-width="6"/>
    <text x="50" y="35" fill="#991b1b" font-family="sans-serif" font-size="11" font-weight="bold">PLAN LECTOR</text>

    <!-- Manzana roja sobre los libros -->
    <circle cx="85" cy="5" r="14" fill="#ef4444"/>
    <path d="M85 -9 Q82 -18 78 -16" stroke="#78350f" stroke-width="2.5" fill="none"/>
    <path d="M85 -9 Q92 -15 95 -10 Q90 -5 85 -9" fill="#16a34a"/>
  </g>

  <!-- Regla Escolar y Escuadra geométrica -->
  <g transform="translate(170, 45) rotate(-20)">
    <rect x="0" y="0" width="120" height="22" rx="3" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5"/>
    <line x1="10" y1="0" x2="10" y2="10" stroke="#ca8a04" stroke-width="1.5"/>
    <line x1="20" y1="0" x2="20" y2="6" stroke="#ca8a04" stroke-width="1"/>
    <line x1="30" y1="0" x2="30" y2="10" stroke="#ca8a04" stroke-width="1.5"/>
    <line x1="40" y1="0" x2="40" y2="6" stroke="#ca8a04" stroke-width="1"/>
    <line x1="50" y1="0" x2="50" y2="10" stroke="#ca8a04" stroke-width="1.5"/>
    <line x1="60" y1="0" x2="60" y2="6" stroke="#ca8a04" stroke-width="1"/>
    <line x1="70" y1="0" x2="70" y2="10" stroke="#ca8a04" stroke-width="1.5"/>
    <line x1="80" y1="0" x2="80" y2="6" stroke="#ca8a04" stroke-width="1"/>
    <line x1="90" y1="0" x2="90" y2="10" stroke="#ca8a04" stroke-width="1.5"/>
    <line x1="100" y1="0" x2="100" y2="6" stroke="#ca8a04" stroke-width="1"/>
  </g>

  <!-- Lupa de exploración de ciencias -->
  <g transform="translate(320, 140)">
    <circle cx="25" cy="25" r="22" fill="#eff6ff" stroke="#0284c7" stroke-width="4"/>
    <line x1="42" y1="42" x2="65" y2="65" stroke="#1e293b" stroke-width="7" stroke-linecap="round"/>
  </g>
</svg>