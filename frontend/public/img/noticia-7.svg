<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="100%" height="100%">
  <defs>
    <linearGradient id="n7Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c2d12"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>
  <rect width="400" height="220" fill="url(#n7Bg)"/>
  <!-- Cordillera de los Andes de fondo -->
  <polygon points="0,220 80,110 160,220" fill="#451a03"/>
  <polygon points="120,220 220,90 320,220" fill="#291508"/>
  <polygon points="260,220 340,120 400,220" fill="#451a03"/>
  <!-- Nieve en picos -->
  <polygon points="80,110 65,135 75,130 80,140 85,130 95,135" fill="#fff"/>
  <polygon points="220,90 200,120 215,115 220,128 225,115 240,120" fill="#fff"/>

  <!-- Sol Inti Andino radiante -->
  <g transform="translate(200, 75)">
    <!-- Rayos del Sol Inti -->
    <g stroke="#f59e0b" stroke-width="4" stroke-linecap="round">
      <line x1="0" y1="-45" x2="0" y2="-60"/>
      <line x1="32" y1="-32" x2="45" y2="-45"/>
      <line x1="45" y1="0" x2="60" y2="0"/>
      <line x1="32" y1="32" x2="45" y2="45"/>
      <line x1="0" y1="45" x2="0" y2="60"/>
      <line x1="-32" y1="32" x2="-45" y2="45"/>
      <line x1="-45" y1="0" x2="-60" y2="0"/>
      <line x1="-32" y1="-32" x2="-45" y2="-45"/>
    </g>
    <!-- Disco solar con rostro expresivo de máscara incaica -->
    <circle cx="0" cy="0" r="38" fill="#fbbf24" stroke="#d97706" stroke-width="3"/>
    <!-- Ojos almendrados -->
    <ellipse cx="-13" cy="-6" rx="6" ry="4" fill="#78350f"/>
    <ellipse cx="13" cy="-6" rx="6" ry="4" fill="#78350f"/>
    <!-- Nariz geométrica -->
    <polygon points="0,-2 -4,10 4,10" fill="#b45309"/>
    <!-- Sonrisa mítica -->
    <path d="M-15 16 Q0 26 15 16" fill="none" stroke="#78350f" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- Máscaras de teatro griega / andina a los lados -->
  <g transform="translate(60, 130)">
    <circle cx="20" cy="20" r="22" fill="#fef08a" stroke="#ca8a04" stroke-width="2"/>
    <ellipse cx="12" cy="15" rx="3" ry="2" fill="#78350f"/>
    <ellipse cx="28" cy="15" rx="3" ry="2" fill="#78350f"/>
    <path d="M12 25 Q20 33 28 25" fill="none" stroke="#78350f" stroke-width="2"/>
  </g>
  <g transform="translate(300, 130)">
    <circle cx="20" cy="20" r="22" fill="#fed7aa" stroke="#ea580c" stroke-width="2"/>
    <ellipse cx="12" cy="15" rx="3" ry="2" fill="#78350f"/>
    <ellipse cx="28" cy="15" rx="3" ry="2" fill="#78350f"/>
    <path d="M12 30 Q20 22 28 30" fill="none" stroke="#78350f" stroke-width="2"/>
  </g>
</svg>