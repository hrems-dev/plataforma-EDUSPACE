<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%">
  <rect width="320" height="180" rx="10" fill="#312e81"/>
  <!-- Estantes de libros y lámpara de lectura -->
  <g transform="translate(40, 20)">
    <!-- Estantería de fondo -->
    <rect x="0" y="30" width="240" height="8" fill="#78350f"/>
    <rect x="0" y="80" width="240" height="8" fill="#78350f"/>
    <rect x="0" y="130" width="240" height="8" fill="#78350f"/>
    <!-- Libros fila 1 -->
    <rect x="15" y="45" width="12" height="35" fill="#f59e0b"/>
    <rect x="30" y="40" width="14" height="40" fill="#ef4444"/>
    <rect x="47" y="50" width="10" height="30" fill="#10b981"/>
    <rect x="60" y="42" width="15" height="38" fill="#38bdf8"/>
    <rect x="150" y="42" width="15" height="38" fill="#ec4899"/>
    <rect x="168" y="48" width="12" height="32" fill="#8b5cf6"/>
    <!-- Libros fila 2 -->
    <rect x="20" y="95" width="14" height="35" fill="#0284c7"/>
    <rect x="37" y="90" width="12" height="40" fill="#f97316"/>
    <rect x="52" y="100" width="16" height="30" fill="#84cc16"/>
    <rect x="140" y="92" width="15" height="38" fill="#eab308"/>
    <!-- Libro grande abierto al centro con lámpara -->
    <g transform="translate(100, 95)">
      <path d="M-25 25 C-12 18 0 20 0 25 C0 20 12 18 25 25 L25 5 C12 -2 0 0 0 5 C0 0 -12 -2 -25 5 Z" fill="#f8fafc"/>
      <path d="M0 5 L0 25" stroke="#94a3b8" stroke-width="1.5"/>
    </g>
    <!-- Lámpara de banquero verde clásica -->
    <path d="M100 45 Q100 20 115 15" stroke="#ca8a04" stroke-width="3" fill="none"/>
    <ellipse cx="100" cy="45" rx="16" ry="6" fill="#15803d"/>
    <polygon points="85,50 115,50 135,115 65,115" fill="#fef08a" opacity="0.18"/>
  </g>
</svg>