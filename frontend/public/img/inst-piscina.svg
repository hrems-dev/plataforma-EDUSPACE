<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%">
  <rect width="320" height="180" rx="10" fill="#0284c7"/>
  <!-- Carriles de natación y agua turquesa -->
  <path d="M0 60 L320 60 L320 180 L0 180 Z" fill="#0ea5e9"/>
  <!-- Carriles con flotadores -->
  <line x1="80" y1="60" x2="40" y2="180" stroke="#ef4444" stroke-width="4" stroke-dasharray="10 8"/>
  <line x1="160" y1="60" x2="160" y2="180" stroke="#facc15" stroke-width="4" stroke-dasharray="10 8"/>
  <line x1="240" y1="60" x2="280" y2="180" stroke="#3b82f6" stroke-width="4" stroke-dasharray="10 8"/>
  <!-- Bloques de partida -->
  <rect x="60" y="42" width="22" height="18" rx="2" fill="#e2e8f0" stroke="#475569"/>
  <rect x="149" y="42" width="22" height="18" rx="2" fill="#e2e8f0" stroke="#475569"/>
  <rect x="238" y="42" width="22" height="18" rx="2" fill="#e2e8f0" stroke="#475569"/>
  <!-- Ondas suaves de agua -->
  <path d="M100 110 Q120 105 140 110 T180 110" fill="none" stroke="#bae6fd" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M180 140 Q200 135 220 140 T260 140" fill="none" stroke="#bae6fd" stroke-width="2.5" stroke-linecap="round"/>
</svg>