  <line x1="50" y1="65" x2="50" y2="110" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="100" y1="42" x2="100" y2="110" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="160" y1="35" x2="160" y2="110" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="220" y1="42" x2="220" y2="110" stroke="#cbd5e1" stroke-width="2"/>
