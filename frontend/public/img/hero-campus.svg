<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 450" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#3b82f6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#93c5fd" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="buildingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="goldCol" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>

  <!-- Cielo y Sol -->
  <rect x="0" y="0" width="700" height="450" rx="20" fill="url(#skyGrad)"/>
  <circle cx="580" cy="80" r="55" fill="url(#sunGrad)" opacity="0.85"/>
  <circle cx="580" cy="80" r="75" fill="#fde047" opacity="0.25"/>

  <!-- Colinas verdes de fondo (Valle) -->
  <path d="M-20 320 Q140 240 320 280 T720 260 L720 450 L-20 450 Z" fill="#15803d" opacity="0.4"/>
  <path d="M-20 350 Q180 300 420 330 T720 310 L720 450 L-20 450 Z" fill="#16a34a" opacity="0.6"/>

  <!-- Edificio Principal del Colegio (Campus Horizonte del Valle) -->
  <!-- Pabellón Central -->
  <g transform="translate(180, 110)">
    <!-- Cuerpo Central -->
    <rect x="70" y="70" width="200" height="170" rx="4" fill="url(#buildingGrad)" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Techo Frontón Clásico Escolar -->
    <polygon points="50,70 170,10 290,70" fill="url(#roofGrad)"/>
    <!-- Reloj de Torre Colegial -->
    <circle cx="170" cy="48" r="16" fill="#fff" stroke="url(#goldCol)" stroke-width="3"/>
    <line x1="170" y1="48" x2="170" y2="39" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <line x1="170" y1="48" x2="178" y2="48" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <!-- Campanario / Cúpula superior -->
    <polygon points="155,10 170,-15 185,10" fill="url(#goldCol)"/>
    <line x1="170" y1="-15" x2="170" y2="-28" stroke="#f59e0b" stroke-width="2"/>
    <!-- Bandera del Colegio -->
    <polygon points="170,-28 195,-22 170,-16" fill="#2563eb"/>

    <!-- Columnas del Pórtico -->
    <rect x="85" y="85" width="24" height="155" fill="#f1f5f9" stroke="#cbd5e1"/>
    <rect x="135" y="85" width="20" height="155" fill="#f1f5f9" stroke="#cbd5e1"/>
    <rect x="185" y="85" width="20" height="155" fill="#f1f5f9" stroke="#cbd5e1"/>
    <rect x="231" y="85" width="24" height="155" fill="#f1f5f9" stroke="#cbd5e1"/>

    <!-- Puerta de Entrada Institucional -->
    <path d="M150 170 Q170 150 190 170 L190 240 L150 240 Z" fill="#1e3a8a"/>
    <rect x="153" y="174" width="15" height="66" fill="#1e293b"/>
    <rect x="172" y="174" width="15" height="66" fill="#1e293b"/>
    <circle cx="165" cy="205" r="2" fill="#fbbf24"/>
    <circle cx="175" cy="205" r="2" fill="#fbbf24"/>

    <!-- Ventanas Escolares con Arcos -->
    <g fill="#bfdbfe" stroke="#64748b" stroke-width="1.5">
      <rect x="95" y="105" width="24" height="36" rx="4"/>
      <line x1="107" y1="105" x2="107" y2="141"/>
      <line x1="95" y1="123" x2="119" y2="123"/>

      <rect x="221" y="105" width="24" height="36" rx="4"/>
      <line x1="233" y1="105" x2="233" y2="141"/>
      <line x1="221" y1="123" x2="245" y2="123"/>
    </g>

    <!-- Alas Laterales del Pabellón -->
    <rect x="-30" y="110" width="100" height="130" rx="3" fill="#e2e8f0" stroke="#cbd5e1"/>
    <polygon points="-35,110 20,80 75,110" fill="#334155"/>
    <g fill="#93c5fd" stroke="#64748b" stroke-width="1.2">
      <rect x="-15" y="130" width="20" height="28" rx="2"/>
      <rect x="15" y="130" width="20" height="28" rx="2"/>
      <rect x="-15" y="175" width="20" height="28" rx="2"/>
      <rect x="15" y="175" width="20" height="28" rx="2"/>
    </g>

    <rect x="270" y="110" width="100" height="130" rx="3" fill="#e2e8f0" stroke="#cbd5e1"/>
    <polygon points="265,110 320,80 375,110" fill="#334155"/>
    <g fill="#93c5fd" stroke="#64748b" stroke-width="1.2">
      <rect x="285" y="130" width="20" height="28" rx="2"/>
      <rect x="315" y="130" width="20" height="28" rx="2"/>
      <rect x="285" y="175" width="20" height="28" rx="2"/>
      <rect x="315" y="175" width="20" height="28" rx="2"/>
    </g>
  </g>

  <!-- Plaza y Áreas Verdes del Campus -->
  <path d="M0 350 L700 350 L700 450 L0 450 Z" fill="#22c55e"/>
  <!-- Sendero Principal -->
  <path d="M220 450 L330 350 L370 350 L480 450 Z" fill="#fed7aa"/>

  <!-- Árboles del Campus -->
  <g transform="translate(60, 260)">
    <rect x="35" y="60" width="12" height="40" fill="#78350f" rx="3"/>
    <circle cx="41" cy="40" r="38" fill="#15803d"/>
    <circle cx="28" cy="25" r="26" fill="#16a34a"/>
    <circle cx="54" cy="30" r="28" fill="#22c55e"/>
  </g>
  <g transform="translate(560, 250)">
    <rect x="35" y="70" width="12" height="40" fill="#78350f" rx="3"/>
    <circle cx="41" cy="50" r="42" fill="#15803d"/>
    <circle cx="25" cy="35" r="30" fill="#16a34a"/>
    <circle cx="56" cy="40" r="32" fill="#22c55e"/>
  </g>

  <!-- Grupo de Estudiantes en Primer Plano -->
  <!-- Estudiante 1 (Chica de secundaria con mochila y libreta) -->
  <g transform="translate(180, 290)">
    <!-- Sombra -->
    <ellipse cx="25" cy="140" rx="22" ry="6" fill="#000" opacity="0.2"/>
    <!-- Piernas / Falda Escolar azul marina con tablas -->
    <rect x="18" y="100" width="5" height="35" fill="#fed7aa"/>
    <rect x="27" y="100" width="5" height="35" fill="#fed7aa"/>
    <!-- Zapatos colegiales -->
    <ellipse cx="20" cy="136" rx="6" ry="4" fill="#0f172a"/>
    <ellipse cx="29" cy="136" rx="6" ry="4" fill="#0f172a"/>
    <!-- Falda -->
    <polygon points="12,75 38,75 42,102 8,102" fill="#1e3a8a"/>
    <!-- Línea dorada en falda -->
    <line x1="9" y1="98" x2="41" y2="98" stroke="#fbbf24" stroke-width="1.5"/>
    <!-- Blusa blanca y chompa colegial azul con cuello en V -->
    <rect x="13" y="40" width="24" height="37" rx="4" fill="#1e3a8a"/>
    <polygon points="21,40 25,56 29,40" fill="#f8fafc"/>
    <polygon points="23,40 25,48 27,40" fill="#dc2626"/> <!-- Corbata roja escolar -->
    <!-- Mochila escolar colorida -->
    <path d="M8 45 Q4 45 4 68 Q4 82 12 82 Z" fill="#8b5cf6"/>
    <!-- Cabeza y cabello -->
    <circle cx="25" cy="22" r="14" fill="#fed7aa"/>
    <path d="M11 20 Q25 4 39 20 Q41 38 36 40 Q25 18 14 40 Z" fill="#451a03"/>
    <!-- Cuaderno escolar con espiral -->
    <rect x="22" y="60" width="18" height="24" rx="2" fill="#0284c7" transform="rotate(8 22 60)"/>
    <line x1="22" y1="60" x2="22" y2="84" stroke="#fff" stroke-width="1.5"/>
  </g>

  <!-- Estudiante 2 (Chico de primaria con mochila y gesto alegre) -->
  <g transform="translate(250, 310)">
    <!-- Sombra -->
    <ellipse cx="25" cy="120" rx="20" ry="5" fill="#000" opacity="0.2"/>
    <!-- Pantalón escolar gris institucional -->
    <rect x="17" y="80" width="7" height="38" fill="#475569"/>
    <rect x="26" y="80" width="7" height="38" fill="#475569"/>
    <ellipse cx="20" cy="118" rx="7" ry="4" fill="#0f172a"/>
    <ellipse cx="29" cy="118" rx="7" ry="4" fill="#0f172a"/>
    <!-- Camisa blanca y chaleco azul marino con escudo -->
    <rect x="14" y="38" width="22" height="44" rx="4" fill="#1e3a8a"/>
    <polygon points="21,38 25,50 29,38" fill="#f8fafc"/>
    <circle cx="19" cy="54" r="2.5" fill="#fbbf24"/> <!-- Mini escudo -->
    <!-- Mochila escolar -->
    <path d="M34 44 Q42 44 42 66 Q42 78 34 78 Z" fill="#0ea5e9"/>
    <!-- Cabeza sonriente -->
    <circle cx="25" cy="22" r="13" fill="#fed7aa"/>
    <path d="M12 20 Q25 8 38 18 Q36 6 25 6 Q14 6 12 20 Z" fill="#1c1917"/>
    <!-- Brazo saludando -->
    <path d="M36 44 L48 26 L54 30 L40 50 Z" fill="#1e3a8a"/>
    <circle cx="52" cy="25" r="5" fill="#fed7aa"/>
  </g>

  <!-- Estudiante 3 (Niña pequeña de Inicial con guardapolvo o delantal escolar) -->
  <g transform="translate(325, 335)">
    <!-- Sombra -->
    <ellipse cx="20" cy="98" rx="16" ry="4" fill="#000" opacity="0.2"/>
    <!-- Zapatitos y medias -->
    <rect x="14" y="68" width="5" height="28" fill="#fff"/>
    <rect x="21" y="68" width="5" height="28" fill="#fff"/>
    <ellipse cx="16" cy="96" rx="5" ry="3" fill="#dc2626"/>
    <ellipse cx="23" cy="96" rx="5" ry="3" fill="#dc2626"/>
    <!-- Delantal de inicial cuadrillé amarillo/blanco -->
    <path d="M10 32 L30 32 L34 70 L6 70 Z" fill="#f59e0b"/>
    <circle cx="20" cy="46" r="3" fill="#ef4444"/>
    <!-- Cabeza con coletas -->
    <circle cx="20" cy="18" r="11" fill="#fed7aa"/>
    <path d="M10 18 Q20 8 30 18 Z" fill="#713f12"/>
    <!-- Coletas con lazos rojos -->
    <circle cx="8" cy="14" r="4" fill="#713f12"/>
    <circle cx="32" cy="14" r="4" fill="#713f12"/>
    <path d="M7 14 L5 12 M33 14 L35 12" stroke="#dc2626" stroke-width="2"/>
    <!-- Lonchera escolar infantil -->
    <rect x="28" y="52" width="14" height="12" rx="2" fill="#10b981"/>
    <path d="M32 52 Q35 47 38 52" stroke="#047857" stroke-width="1.5" fill="none"/>
  </g>

  <!-- Estudiante 4 (Chico de secundaria con laptop/carpeta y audífonos) -->
  <g transform="translate(420, 285)">
    <!-- Sombra -->
    <ellipse cx="25" cy="146" rx="22" ry="6" fill="#000" opacity="0.2"/>
    <!-- Pantalón -->
    <rect x="17" y="100" width="7" height="44" fill="#334155"/>
    <rect x="26" y="100" width="7" height="44" fill="#334155"/>
    <ellipse cx="20" cy="144" rx="7" ry="4" fill="#0f172a"/>
    <ellipse cx="30" cy="144" rx="7" ry="4" fill="#0f172a"/>
    <!-- Chompa escolar con rayas de promoción -->
    <rect x="13" y="44" width="24" height="58" rx="4" fill="#1e3a8a"/>
    <line x1="13" y1="88" x2="37" y2="88" stroke="#fbbf24" stroke-width="2"/>
    <line x1="13" y1="92" x2="37" y2="92" stroke="#fff" stroke-width="1.5"/>
    <!-- Cabeza -->
    <circle cx="25" cy="24" r="14" fill="#fed7aa"/>
    <path d="M11 20 Q25 8 39 18 Q36 6 25 6 Q14 6 11 20 Z" fill="#292524"/>
    <!-- Mochila -->
    <path d="M6 48 Q2 48 2 74 Q2 90 10 90 Z" fill="#059669"/>
    <!-- Mochila / Carpeta institucional bajo el brazo -->
    <rect x="26" y="66" width="20" height="26" rx="2" fill="#475569" transform="rotate(-10 26 66)"/>
  </g>
</svg>