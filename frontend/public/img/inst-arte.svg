<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%">
  <rect width="320" height="180" rx="10" fill="#c2410c"/>
  <!-- Caballete de pintura y paleta de artista -->
  <g transform="translate(90, 20)">
    <!-- Caballete trípode -->
    <line x1="70" y1="10" x2="20" y2="150" stroke="#78350f" stroke-width="5" stroke-linecap="round"/>
    <line x1="70" y1="10" x2="120" y2="150" stroke="#78350f" stroke-width="5" stroke-linecap="round"/>
    <line x1="70" y1="10" x2="70" y2="150" stroke="#451a03" stroke-width="4"/>
    <!-- Travesaño soporte -->
    <rect x="25" y="105" width="90" height="8" rx="2" fill="#9a3412"/>
    <!-- Lienzo con pintura de paisaje escolar -->
    <rect x="35" y="45" width="70" height="60" rx="3" fill="#f8fafc" stroke="#fed7aa" stroke-width="2"/>
    <path d="M40 90 Q60 65 75 80 Q90 60 100 90 Z" fill="#22c55e"/>
    <circle cx="55" cy="62" r="6" fill="#f59e0b"/>
  </g>
  <!-- Paleta de pintor con manchas de color -->
  <g transform="translate(200, 95)">
    <path d="M0 25 C0 5 45 5 45 25 C45 35 35 45 25 45 C15 45 18 35 10 35 C5 35 0 32 0 25 Z" fill="#fed7aa" stroke="#ca8a04" stroke-width="2"/>
    <circle cx="8" cy="27" r="4" fill="#0f172a"/>
    <circle cx="15" cy="15" r="3" fill="#ef4444"/>
    <circle cx="27" cy="14" r="3" fill="#3b82f6"/>
    <circle cx="37" cy="22" r="3" fill="#eab308"/>
    <circle cx="32" cy="34" r="3" fill="#10b981"/>
  </g>
</svg>