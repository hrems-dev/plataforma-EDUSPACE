<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="secBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="100%" stop-color="#ede9fe"/>
    </linearGradient>
  </defs>
  <!-- Fondo violeta académico suave -->
  <rect width="400" height="240" rx="14" fill="url(#secBg)"/>

  <!-- Modelo Atómico de Ciencias de Fondo -->
  <g transform="translate(320, 60)" opacity="0.4">
    <ellipse cx="0" cy="0" rx="45" ry="18" fill="none" stroke="#7c3aed" stroke-width="2" transform="rotate(30)"/>
    <ellipse cx="0" cy="0" rx="45" ry="18" fill="none" stroke="#7c3aed" stroke-width="2" transform="rotate(-30)"/>
    <ellipse cx="0" cy="0" rx="45" ry="18" fill="none" stroke="#7c3aed" stroke-width="2" transform="rotate(90)"/>
    <circle cx="0" cy="0" r="8" fill="#6d28d9"/>
    <circle cx="35" cy="18" r="4" fill="#a855f7"/>
    <circle cx="-35" cy="-18" r="4" fill="#a855f7"/>
  </g>

  <!-- Laptop de Tecnología y Robótica -->
  <g transform="translate(40, 110)">
    <!-- Base -->
    <path d="M-10 80 L130 80 L120 88 L0 88 Z" fill="#cbd5e1"/>
    <!-- Pantalla -->
    <rect x="0" y="0" width="110" height="75" rx="5" fill="#1e293b"/>
    <rect x="6" y="6" width="98" height="63" rx="3" fill="#0f172a"/>
    <!-- Código / Gráfico en pantalla -->
    <line x1="14" y1="18" x2="50" y2="18" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
    <line x1="20" y1="28" x2="70" y2="28" stroke="#4ade80" stroke-width="3" stroke-linecap="round"/>
    <line x1="20" y1="38" x2="45" y2="38" stroke="#f472b6" stroke-width="3" stroke-linecap="round"/>
    <line x1="14" y1="48" x2="60" y2="48" stroke="#facc15" stroke-width="3" stroke-linecap="round"/>
    <!-- Logo manzana/círculo en marco -->
    <circle cx="55" cy="71" r="1.5" fill="#94a3b8"/>
  </g>

  <!-- Microscopio de Laboratorio de Ciencias -->
  <g transform="translate(175, 45)">
    <!-- Base -->
    <rect x="15" y="145" width="70" height="15" rx="3" fill="#334155"/>
    <!-- Brazo curvado -->
    <path d="M30 145 C30 80 80 70 80 50" fill="none" stroke="#475569" stroke-width="12" stroke-linecap="round"/>
    <!-- Platina portaobjetos -->
    <rect x="25" y="105" width="45" height="6" rx="2" fill="#1e293b"/>
    <line x1="35" y1="104" x2="60" y2="104" stroke="#38bdf8" stroke-width="3"/> <!-- Vidrio portaobjeto -->
    <!-- Tubo y revólver de objetivos -->
    <rect x="42" y="30" width="16" height="55" rx="3" fill="#64748b" transform="rotate(-15 50 55)"/>
    <!-- Ocular superior -->
    <rect x="52" y="15" width="20" height="18" rx="2" fill="#1e293b" transform="rotate(-15 62 24)"/>
    <!-- Objetivos apuntando a muestra -->
    <polygon points="38,82 48,82 46,95 40,95" fill="#f59e0b"/>
  </g>

  <!-- Matraz Erlenmeyer con Reacción Química -->
  <g transform="translate(265, 105)">
    <!-- Base matraz y líquido -->
    <path d="M30 0 L45 0 L45 25 L75 75 C78 82 72 90 65 90 L10 90 C3 90 -3 82 0 75 L30 25 Z"
          fill="#c084fc" opacity="0.25" stroke="#7c3aed" stroke-width="3"/>
    <!-- Líquido reactivo violeta/azul -->
    <path d="M8 70 C20 65 40 75 67 70 L65 88 L10 88 Z" fill="#7c3aed"/>
    <!-- Burbujas químicas -->
    <circle cx="37" cy="60" r="4" fill="#e9d5ff"/>
    <circle cx="28" cy="45" r="3" fill="#e9d5ff"/>
    <circle cx="42" cy="30" r="2.5" fill="#e9d5ff"/>
  </g>

  <!-- Birrete de Graduación / Preuniversitaria -->
  <g transform="translate(60, 25)">
    <!-- Rombo superior -->
    <polygon points="45,0 90,14 45,28 0,14" fill="#1e1b4b"/>
    <polygon points="45,2 86,14 45,26 4,14" fill="#312e81"/>
    <!-- Casquete inferior -->
    <path d="M22 18 L22 36 C22 45 68 45 68 36 L68 18" fill="#1e1b4b"/>
    <!-- Borla dorada de excelencia académica -->
    <circle cx="45" cy="14" r="3" fill="#f59e0b"/>
    <path d="M45 14 Q65 18 70 34" stroke="#f59e0b" stroke-width="2" fill="none"/>
    <rect x="67" y="34" width="7" height="15" rx="1" fill="#f59e0b"/>
  </g>
</svg>