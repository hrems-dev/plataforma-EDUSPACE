server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://eduspace-loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: eduspace-microservices
    static_configs:
      - targets:
          - localhost
        labels:
          job: eduspace-services
          __path__: /var/log/eduspace/**/*.log
    pipeline_stages:
      - regex:
          expression: '^(?P<timestamp>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}\.\d{3})\s+\[(?P<thread>.*?)\]\s+(?P<level>\w+)\s+(?P<logger>.*?)\s+\[(?P<traceId>.*?)\]\s+-\s+(?P<message>.*)$'
      - labels:
          level:
          logger:
          traceId:

