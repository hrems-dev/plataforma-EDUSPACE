# Infraestructura mínima para correr y probar los 3 servicios de Hermes en DEV
# (planificacion-ms, alumnos-ms, notificaciones-ms). Puertos de pagatu/EduSpace: Kafka 19092, MinIO 19000/19001,
# Kafka UI 18085. Mailpit (SMTP falso) viene en el compose-dev.yml de notificaciones-ms. Levantar: docker compose -f kafka/compose-dev.yml up -d
name: eduspace-infra-dev
services:
  kafka:
    image: apache/kafka:4.3.1
    container_name: eduspace-kafka
    ports:
      - "19092:19092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:19092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"   # los tópicos los crea el servicio productor
    volumes:
      - kafka-data:/var/lib/kafka/data

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    container_name: eduspace-kafka-ui
    depends_on: [kafka]
    ports:
      - "18085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: eduspace-dev
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

  minio:
    image: cgr.dev/chainguard/minio:latest   # las imágenes oficiales de MinIO ya no se publican en Docker Hub ni en Quay
    container_name: eduspace-minio
    command: server /data --console-address ":9001"
    ports:
      - "19000:9000"
      - "19001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio-data:/data

volumes:
  kafka-data:
  minio-data:
