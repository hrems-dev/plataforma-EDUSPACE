version: '3.8'

services:
  matricula-db:
    image: postgres:16-alpine
    container_name: eduspace-matricula-db-dev
    environment:
      POSTGRES_DB: matricula_db
      POSTGRES_USER: eduspace
      POSTGRES_PASSWORD: eduspace
      TZ: America/Lima
    ports:
      - "15443:5432"
    volumes:
      - matricula_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eduspace -d matricula_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  matricula_db_data:

