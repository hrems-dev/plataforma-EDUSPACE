# DEV: solo la base de datos de este servicio; la aplicación corre con Maven.
name: eduspace-notificaciones-dev
services:
  notificaciones-db:
    image: postgres:16-alpine
    container_name: eduspace-notificaciones-db
    environment:
      POSTGRES_DB: notificaciones_db
      POSTGRES_USER: ${DB_USER:-eduspace}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-eduspace}
      TZ: America/Lima
    ports:
      - "15449:5432"
    volumes:
      - notificaciones-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-eduspace} -d notificaciones_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.21
    container_name: eduspace-mailpit
    ports:
      - "11025:1025"   # SMTP
      - "18025:8025"   # interfaz web

volumes:
  notificaciones-db-data:
