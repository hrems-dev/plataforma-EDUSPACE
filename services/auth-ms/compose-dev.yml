version: '3.8'

services:
  auth-db:
    image: postgres:16-alpine
    container_name: eduspace-auth-db-dev
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: eduspace
      POSTGRES_PASSWORD: eduspace
      TZ: America/Lima
    ports:
      - "15440:5432"
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eduspace -d auth_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  auth_db_data:

