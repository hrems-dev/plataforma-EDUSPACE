server:
  port: ${PORT:8094}
  shutdown: graceful

spring:
  application:
    name: asistencia-ms
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:18888}"
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:15444}/${DB_NAME:asistencia_db}}
    username: ${DB_USERNAME:eduspace}
    password: ${DB_PASSWORD:eduspace}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: AsistenciaHikariPool
      maximum-pool-size: 15
      minimum-idle: 5
      connection-timeout: 20000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: public
        jdbc:
          time_zone: America/Lima
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
    consumer:
      group-id: asistencia-ms
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 8000
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWK_SET_URI:http://localhost:8090/.well-known/jwks.json}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:18761/eureka/}
    register-with-eureka: ${EUREKA_REGISTER:true}
    fetch-registry: ${EUREKA_FETCH:true}
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always

app:
  asistencia:
    estado-por-defecto: PRESENTE          # estado con que se precargan los alumnos al abrir la hoja
    marcar-falta-sin-registro: false      # el cierre nocturno marca FALTA a lo que el docente nunca confirmó
    limite-inasistencia-porcentaje: 30    # alerta de "exceso de faltas"
    archivo-max-mb: 5
    tipos-archivo: application/pdf,image/jpeg,image/png
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:19000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket-justificaciones: justificaciones

resilience4j:
  circuitbreaker:
    instances:
      alumnosClient: &cb
        slidingWindowSize: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        ignoreExceptions:
          - pe.edu.upeu.eduspace.asistencia.exception.ResourceNotFoundException
      planificacionClient: *cb
      matriculaClient: *cb
