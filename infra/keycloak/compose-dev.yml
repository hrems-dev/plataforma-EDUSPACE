name: eduspace-keycloak-dev

# Keycloak SOLO para DEV (start-dev: base H2 en memoria, HTTP, sin caché de plantillas). El realm se importa al arrancar.
# En PROD el emisor de tokens sigue siendo auth-ms; ver infra/keycloak/README.md.
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.1.0
    container_name: eduspace-keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-admin}
      KC_HEALTH_ENABLED: "true"
      JAVA_OPTS_APPEND: "-Xms256m -Xmx640m"
    volumes:
      - ./eduspace-realm.json:/opt/keycloak/data/import/eduspace-realm.json:ro,z
    ports:
      - "18090:8080"
