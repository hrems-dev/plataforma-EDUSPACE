# PROD local: cada servicio escucha en 8080 dentro de Docker y no publica puerto (solo el Gateway se expone).
# Las credenciales llegan por variables de entorno, nunca por este repositorio.
server:
  port: 8080
spring:
  datasource:
    url: jdbc:postgresql://auth-ms-db:5432/auth_db
    username: ${DB_USER}
    password: ${DB_PASSWORD}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

# Token compartido entre servicios para /internal/** (obligatorio en PROD: sin él el servicio no arranca).
eduspace:
  service-token: ${SERVICE_TOKEN}
