server:
  port: 18080
  forward-headers-strategy: framework     # detrás del balanceador, la IP del rate limit es la del cliente

spring:
  application:
    name: eduspace-gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWK_SET_URI}
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 7MB
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: auth-route
              uri: lb://auth-ms
              predicates:
                - Path=/api/v1/auth/**
            - id: planificacion-route
              uri: lb://planificacion-ms
              predicates:
                - Path=/api/v1/planificacion/**
            - id: alumnos-route
              uri: lb://alumnos-ms
              predicates:
                - Path=/api/v1/alumnos/**
            - id: apoderados-route
              uri: lb://alumnos-ms
              predicates:
                - Path=/api/v1/apoderados/**
            - id: notificaciones-route
              uri: lb://notificaciones-ms
              predicates:
                - Path=/api/v1/notificaciones/**
            - id: calificaciones-route
              uri: lb://calificaciones-ms
              predicates:
                - Path=/api/v1/calificaciones/**
            - id: pagos-route
              uri: lb://pago-ms
              predicates:
                - Path=/api/v1/pagos/**
            - id: examenes-route
              uri: lb://examenes-ms
              predicates:
                - Path=/api/v1/examenes/**
            - id: publico-route
              uri: lb://matricula-ms
              predicates:
                - Path=/api/v1/publico/**
            - id: matriculas-route
              uri: lb://matricula-ms
              predicates:
                - Path=/api/v1/matriculas/**
            - id: asistencia-route
              uri: lb://asistencia-ms
              predicates:
                - Path=/api/v1/asistencia/**
            - id: tareas-route
              uri: lb://tareas-ms
              predicates:
                - Path=/api/v1/tareas/**

eduspace:
  gateway:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS}      # obligatorio: sin valor por defecto
    actuator-public: false                          # solo /actuator/health e info sin token
    rate-limit:
      enabled: true
      requests-per-minute: 300
      burst: 50
      login-per-minute: 10
      login-burst: 5
      public-per-minute: 30    # matrícula en línea del sitio público (sin sesión): más estricto que la API
      public-burst: 15

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
