# PROD local: cada servicio escucha en 8080 dentro de Docker y no publica puerto (solo el Gateway se expone).
# Las credenciales llegan por variables de entorno, nunca por este repositorio.
server:
  port: 8080
spring:
  datasource:
    url: jdbc:postgresql://notificaciones-ms-db:5432/notificaciones_db
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: America/Lima
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:kafka:9092}
    consumer:
      group-id: notificaciones-ms
      auto-offset-reset: earliest
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWK_SET_URI:http://auth-ms:8080/.well-known/jwks.json}
  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 3000
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://eureka-server:8761/eureka}
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.value}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
app:
  security:
    swagger-public: false
  clients:
    alumnos:
      url: ''
  mail:
    from: ${MAIL_FROM:notificaciones@eduspace.pe}
  reintentos:
    max-intentos: 3
    intervalo: PT1M
    lote: 100
  contactos:
    cache-ttl: PT5M
    cache-max-size: 5000
  limpieza:
    dias-eventos-procesados: 30
resilience4j:
  circuitbreaker:
    instances:
      alumnosClient:
        sliding-window-size: 5
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3

# PROD: SERVICE_TOKEN es obligatorio (sin valor por defecto): el servicio no arranca sin él.
eduspace:
  service-token: ${SERVICE_TOKEN}
