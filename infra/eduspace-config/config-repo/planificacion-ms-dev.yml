# DEV: las aplicaciones corren con Maven; solo las bases, Kafka, MinIO y Mailpit corren en Docker.
server:
  port: 8091
spring:
  datasource:
    url: jdbc:postgresql://localhost:15441/planificacion_db
    username: ${DB_USER:eduspace}
    password: ${DB_PASSWORD:eduspace}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: America/Lima
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:19092}
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWK_SET_URI:http://localhost:18090/realms/eduspace/protocol/openid-connect/certs}
eureka:
  client:
    registry-fetch-interval-seconds: 5      # DEV: ve a los demás servicios en segundos, no en 30 s
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:18761/eureka}
  instance:
    hostname: localhost
    instance-id: ${spring.application.name}:${server.port}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
app:
  security:
    swagger-public: true
  kafka:
    topic:
      horario-publicado: horario.publicado
      anio-activado: anio.activado
      periodo-cambiado: periodo.cambiado

# Token compartido entre servicios para /internal/** (header X-Service-Token). Sin él, /internal responde 401.
eduspace:
  service-token: ${SERVICE_TOKEN:eduspace-dev-service-token}
